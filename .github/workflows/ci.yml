name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Librerías del sistema para OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      # la rueda de linux por defecto trae CUDA (unos 2 GB) y en el runner no hay gpu
      - name: PyTorch para CPU
        run: pip install torch==2.3.0 torchvision==0.18.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Dependencias
        run: pip install -r requirements-dev.txt

      - name: Caché de modelos
        uses: actions/cache@v4
        with:
          path: backend/models/*.pth
          key: models-${{ hashFiles('backend/download_models.py') }}

      - name: Modelos de Hugging Face
        run: python download_models.py --verify

      - name: Pruebas
        run: pytest

  frontend:
    name: Frontend (Jest y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react2
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-react2/package-lock.json

      - run: npm ci
      - run: npm test -- --watchAll=false
      - run: npm run build
